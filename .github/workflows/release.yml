name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm   # arm64 runner matches the proot payload
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless android-sdk-build-tools \
                                    apksigner zipalign unzip python3 curl openssl

      - name: Fetch build inputs (android.jar, r8 dexer)
        run: bash tools/fetch-tools.sh

      - name: Unit tests
        run: bash tools/test.sh

      - name: Check tag matches version.json
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#v}"
          FILE_VERSION="$(python3 -c 'import json;print(json.load(open("version.json"))["versionName"])')"
          test "$FILE_VERSION" = "$VERSION_NAME" || {
            echo "tag $TAG does not match version.json versionName $FILE_VERSION — bump version.json first"
            exit 1
          }

      - name: Build release APK
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#v}"
          echo "building $VERSION_NAME from $TAG"
          bash build.sh
          APK="dist/CodeServerGo-${VERSION_NAME}.apk"
          test -f "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Verify release (package, version, signer pin)
        run: bash tools/verify-release.sh

      - name: Generate version.json (with apkUrl + sha256)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG APK=$APK"
          cp version.json .version.src.json
          SRC_VERSION_JSON="$PWD/.version.src.json" bash tools/make-version-json.sh "$TAG" "$APK" > version.release.json
          mv version.release.json version.json
          printf 'release version.json:\n'
          cat version.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES="$(python3 -c 'import json;print(json.load(open("version.json"))["notes"])')"
          gh release create "$TAG" \
            --title "CodeServer Go ${TAG#v}" \
            --notes "$NOTES" \
            "$APK" \
            version.json
